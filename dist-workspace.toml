[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "homebrew"]
tap = "treygoff24/homebrew-tap"
# Formula name so `brew install treygoff24/tap/lens` works despite the lens-cli package name
formula = "lens"
publish-jobs = ["homebrew"]
# Windows is unsupported, so no Windows target
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
